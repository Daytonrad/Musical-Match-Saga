name: Check links

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -w /input -v "$GITHUB_WORKSPACE:/input:ro" -e GITHUB_TOKEN \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --no-progress --exclude-loopback README.md CONTRIBUTING.md CODE_OF_CONDUCT.md index.html privacy.html accessibility.html
