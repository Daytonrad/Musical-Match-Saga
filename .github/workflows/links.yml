name: Check links

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.html'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --no-progress --exclude-loopback README.md CONTRIBUTING.md CODE_OF_CONDUCT.md index.html privacy.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
